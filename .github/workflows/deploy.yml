name: Publicar en Cloudflare Pages

# Se ejecuta al subir cambios a main, y también a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Evita que dos publicaciones se pisen si se suben cambios seguidos.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Las credenciales de Supabase no están en el repo (están en los secrets),
      # así que se escriben en un .env.local antes de compilar.
      - name: Escribir credenciales de Supabase
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env.local
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env.local

      - name: Compilar
        run: npx vite build --mode development

      - name: Publicar en Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.114.17'
          command: pages deploy dist --project-name=tutorapp --branch=main
